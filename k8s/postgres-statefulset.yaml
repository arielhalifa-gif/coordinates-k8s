apiVersion: apps/v1

kind: StatefulSet

metadata:
  name: postgres

spec:
  serviceName: postgres-svc
  replicas: 3
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres-container
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "coordinates_db"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "postgres"
          volumeMounts:
            - name: www
              mounthPath: /var/lib/postgresql/data
    volumeClaimTemplates:
      - metadata:
          name: www
        spec:
          accessMode: ["ReadWriteOnce"]
          storageClassName: "postgres-storage"
          resources:
            requests:
              storage: 1Gi